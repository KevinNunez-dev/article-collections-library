<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Lower back pain care options</title>
  <desc id="desc">A neutral decision map: warning signs call for medical assessment; otherwise compare active conservative care, primary care, and specialist input to personal needs.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#355982"/></marker></defs>
  <rect width="900" height="420" rx="24" fill="#f2f6fb"/>
  <rect x="285" y="24" width="330" height="76" rx="16" fill="#173b61"/>
  <text x="450" y="57" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">Lower back pain</text>
  <text x="450" y="82" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="16">Start with safety and individual needs</text>
  <path d="M450 100v42M450 142H225v25M450 142h225v25" fill="none" stroke="#355982" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="55" y="175" width="340" height="95" rx="14" fill="#fff1ef" stroke="#a6382e" stroke-width="3"/>
  <text x="225" y="207" text-anchor="middle" fill="#7f241d" font-family="Arial,sans-serif" font-size="19" font-weight="700">Warning signs or major trauma?</text>
  <text x="225" y="237" text-anchor="middle" fill="#54201d" font-family="Arial,sans-serif" font-size="17">Seek prompt medical assessment</text>
  <rect x="505" y="175" width="340" height="95" rx="14" fill="#e8f1fb" stroke="#355982" stroke-width="3"/>
  <text x="675" y="207" text-anchor="middle" fill="#173b61" font-family="Arial,sans-serif" font-size="19" font-weight="700">No urgent warning signs?</text>
  <text x="675" y="237" text-anchor="middle" fill="#263b52" font-family="Arial,sans-serif" font-size="17">Discuss goals and reasonable options</text>
  <path d="M675 270v42M675 312H445v20M675 312h230v20" fill="none" stroke="#355982" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="275" y="340" width="330" height="58" rx="12" fill="#fff" stroke="#4772a5" stroke-width="2"/>
  <text x="440" y="365" text-anchor="middle" fill="#173b61" font-family="Arial,sans-serif" font-size="18" font-weight="700">Active conservative care</text>
  <text x="440" y="386" text-anchor="middle" fill="#263b52" font-family="Arial,sans-serif" font-size="15">May include movement or physical therapy</text>
  <rect x="640" y="340" width="230" height="58" rx="12" fill="#fff" stroke="#4772a5" stroke-width="2"/>
  <text x="755" y="365" text-anchor="middle" fill="#173b61" font-family="Arial,sans-serif" font-size="17" font-weight="700">Medical or specialist</text>
  <text x="755" y="386" text-anchor="middle" fill="#263b52" font-family="Arial,sans-serif" font-size="15">Input when indicated</text>
</svg>
