<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Four parts of a care-cost comparison</title>
  <desc id="desc">Separate boxes represent provider charges, insurance cost sharing, transportation expenses, and time away from work; only direct expenses are summed, while potential lost earnings stay separate.</desc>
  <rect width="900" height="420" rx="24" fill="#f2f6fb"/>
  <g font-family="Arial,sans-serif">
    <rect x="35" y="65" width="195" height="200" rx="16" fill="#fff" stroke="#355982" stroke-width="3"/>
    <text x="132" y="111" text-anchor="middle" fill="#173b61" font-size="20" font-weight="700">Care charge</text>
    <text x="132" y="151" text-anchor="middle" fill="#263b52" font-size="17">Billed price, cash</text>
    <text x="132" y="178" text-anchor="middle" fill="#263b52" font-size="17">quote, or allowed</text>
    <text x="132" y="205" text-anchor="middle" fill="#263b52" font-size="17">amount are distinct</text>
    <text x="132" y="239" text-anchor="middle" fill="#263b52" font-size="16">Verify what is included</text>
    <text x="245" y="174" fill="#355982" font-size="34" font-weight="700">+</text>
    <rect x="270" y="65" width="195" height="200" rx="16" fill="#e8f1fb" stroke="#355982" stroke-width="3"/>
    <text x="367" y="111" text-anchor="middle" fill="#173b61" font-size="20" font-weight="700">Plan share</text>
    <text x="367" y="151" text-anchor="middle" fill="#263b52" font-size="17">Deductible, copay,</text>
    <text x="367" y="178" text-anchor="middle" fill="#263b52" font-size="17">coinsurance, network,</text>
    <text x="367" y="205" text-anchor="middle" fill="#263b52" font-size="17">and visit limits</text>
    <text x="367" y="239" text-anchor="middle" fill="#263b52" font-size="16">Confirm with your plan</text>
    <text x="480" y="174" fill="#355982" font-size="34" font-weight="700">+</text>
    <rect x="505" y="65" width="160" height="200" rx="16" fill="#fff" stroke="#355982" stroke-width="3"/>
    <text x="585" y="111" text-anchor="middle" fill="#173b61" font-size="20" font-weight="700">Travel</text>
    <text x="585" y="160" text-anchor="middle" fill="#263b52" font-size="17">Transport cost</text>
    <text x="585" y="188" text-anchor="middle" fill="#263b52" font-size="17">and travel time</text>
    <text x="585" y="239" text-anchor="middle" fill="#263b52" font-size="16">Count per visit</text>
    <text x="680" y="174" fill="#355982" font-size="34" font-weight="700">+</text>
    <rect x="705" y="65" width="160" height="200" rx="16" fill="#fff8e9" stroke="#9b6b15" stroke-width="3"/>
    <text x="785" y="111" text-anchor="middle" fill="#744d0d" font-size="20" font-weight="700">Work time</text>
    <text x="785" y="160" text-anchor="middle" fill="#4d3a18" font-size="17">Potential unpaid</text>
    <text x="785" y="188" text-anchor="middle" fill="#4d3a18" font-size="17">earnings loss</text>
    <text x="785" y="239" text-anchor="middle" fill="#4d3a18" font-size="16">Show separately</text>
    <rect x="155" y="310" width="590" height="70" rx="14" fill="#173b61"/>
    <text x="450" y="340" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Direct expense estimate ≠ total life impact</text>
    <text x="450" y="366" text-anchor="middle" fill="#fff" font-size="16">Do not add lost earnings to direct expenses or count the same time twice.</text>
  </g>
</svg>
