name: Publish five lower-back-pain articles
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-back-pain-series.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Repair and publish only the five approved articles
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import matter from 'gray-matter';
          const slugs = [
            'lower-back-pain-treatment-michigan-troy',
            'nonsurgical-lower-back-pain-treatment-metro-detroit',
            'physical-therapy-vs-robotic-precision-therapy-lower-back-pain',
            'lower-back-pain-treatment-costs-michigan',
            'choose-lower-back-pain-provider-troy-michigan',
          ];
          const updates = slugs.map(slug => {
            const path = `src/content/articles/${slug}.md`;
            const original = fs.readFileSync(path, 'utf8');
            const repaired = original.replace(/^  noindex: false---[ \t]*$/m, '  noindex: false\n---');
            const match = repaired.match(/^(---\r?\n)([\s\S]*?)(\r?\n---)(?=\r?\n|$)/);
            if (!match) throw new Error(`Invalid frontmatter: ${path}`);
            const frontmatter = match[2]
              .replace(/^draft: (?:true|false)[ \t]*$/m, 'draft: false')
              .replace(/^  noindex: (?:true|false)[ \t]*$/m, '  noindex: false');
            const content = match[1] + frontmatter + match[3] + repaired.slice(match[0].length);
            const parsed = matter(content);
            if (parsed.data.draft !== false || parsed.data.seo?.noindex !== false || !parsed.content.trim()) {
              throw new Error(`Publication validation failed: ${path}`);
            }
            if (parsed.content !== matter(repaired).content) throw new Error(`Article body changed: ${path}`);
            return [path, content];
          });
          for (const [path, content] of updates) fs.writeFileSync(path, content);
          JS
      - name: Validate calculator and production build
        run: |
          npm run test:calculator
          npm run build
      - name: Commit repaired published articles to main
        shell: bash
        run: |
          git add -- src/content/articles/lower-back-pain-treatment-michigan-troy.md src/content/articles/nonsurgical-lower-back-pain-treatment-metro-detroit.md src/content/articles/physical-therapy-vs-robotic-precision-therapy-lower-back-pain.md src/content/articles/lower-back-pain-treatment-costs-michigan.md src/content/articles/choose-lower-back-pain-provider-troy-michigan.md
          if git diff --cached --quiet; then
            echo 'The five articles are already published with valid frontmatter.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair frontmatter for five published lower-back-pain articles'
          git push origin HEAD:main
